name: Deploy Preview

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pages-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: true

jobs:
  deploy-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build -- --base=/el400/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: pedropaulovc/pedropaulovc.github.io
          publish_dir: ./dist
          destination_dir: el400
          keep_files: true

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build -- --base=/el400/pr-${{ github.event.pull_request.number }}/

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: pedropaulovc/pedropaulovc.github.io
          publish_dir: ./dist
          destination_dir: el400/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Preview Deployment

            :rocket: **Preview:** https://gh.vza.net/el400/pr-${{ github.event.pull_request.number }}/

            _Updated for commit ${{ github.event.pull_request.head.sha }}_

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: pedropaulovc/pedropaulovc.github.io
          ref: main
          token: ${{ secrets.PAGES_DEPLOY_TOKEN }}

      - name: Remove preview directory
        run: |
          if [ -d "el400/pr-${{ github.event.pull_request.number }}" ]; then
            rm -rf el400/pr-${{ github.event.pull_request.number }}
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Clean up el400 PR #${{ github.event.pull_request.number }} preview" || echo "Nothing to commit"
            git push
          fi

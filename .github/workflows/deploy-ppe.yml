name: Deploy PR Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  WORKER_NAME: el400-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-ppe
      url: https://el400-pr-${{ github.event.pull_request.number }}.el400-ppe-vza-net.workers.dev
    steps:
      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy PR Worker
        run: npx wrangler deploy --name "$WORKER_NAME"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Record deployment URL
        run: echo "Deployed [$WORKER_NAME](https://$WORKER_NAME.el400-ppe-vza-net.workers.dev)." >> "$GITHUB_STEP_SUMMARY"

  deprovision:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cloudflare-ppe
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Delete PR Worker
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          output="$(npx --yes wrangler@4.123.0 delete "$WORKER_NAME" --force 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"

          if [[ $status -eq 0 ]]; then
            exit 0
          fi

          if [[ "$output" == *"[code: 10090]"* ]]; then
            echo "$WORKER_NAME is already absent."
            exit 0
          fi

          exit "$status"

# Cloudflare Worker static-assets configuration.
# GitHub Actions deploys branches to the isolated PPE account and main to the
# production account. The workflows supply the account ID and API token.
name = "el400"
compatibility_date = "2026-05-30"

# Static-assets-only Worker (no server-side `main`): serves the Vite build in ./dist.
[assets]
directory = "./dist"
# SPA fallback so React Router deep links resolve to index.html.
not_found_handling = "single-page-application"
